<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ピエロの積み木倒し</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#17103b;color:#fff;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;touch-action:none;user-select:none}button{font:inherit}.app{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#733fa0,#17103b 68%)}.shell{position:relative;width:min(100vw,60vh);height:min(100dvh,166.67vw);max-height:100svh;overflow:hidden;background:linear-gradient(#431d79 0 48%,#ef6b6b 48% 51%,#f4cf68 51%);border-inline:2px solid #fff3}.stars{position:absolute;inset:0 0 48%;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#ffdb55 2px,transparent 2px);background-size:43px 43px,79px 79px;animation:stars 16s linear infinite}@keyframes stars{to{background-position:0 170px,60px 260px}}.tent{position:absolute;left:-8%;right:-8%;bottom:-10%;height:40%;background:repeating-linear-gradient(100deg,#e64355 0 44px,#fff0a2 44px 88px);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.72}.screen{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 12px max(15px,env(safe-area-inset-bottom));background:#1a0c39d8}.screen.show{display:flex}.panel{width:94%;text-align:center;padding:20px 14px;border:4px solid #ffd953;border-radius:26px;background:linear-gradient(155deg,#572583f2,#b72c6eef);box-shadow:0 0 30px #ffdc6577,inset 0 0 25px #fff2}.title{margin:5px;font-size:clamp(34px,9vw,53px);line-height:1.05;text-shadow:0 4px #7d184d,0 0 18px #fff}.hero{font-size:83px;animation:bob .75s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-11px) rotate(5deg)}}.btn{min-width:190px;padding:15px 22px;margin:8px;border:3px solid #fff;border-radius:18px;color:#4b183e;font-size:20px;font-weight:1000;background:linear-gradient(#fff69f,#ffb631);box-shadow:0 7px #ac5d13}.btn:active{transform:translateY(5px);box-shadow:0 2px #ac5d13}.game{position:absolute;z-index:5;inset:0;display:none;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.game.show{display:flex}.hud{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:7px;border:2px solid #fff8;border-radius:12px;background:#201343c9;text-align:center;font-size:11px}.stat b{display:block;color:#ffe261;font-size:22px}.stat.danger{animation:danger .45s infinite alternate;background:#9d1238}.stat.danger b{color:#fff}@keyframes danger{to{transform:scale(1.04);box-shadow:0 0 18px #ff4e60}}.arena{position:relative;flex:1;min-height:0;margin-top:7px;border:3px solid #fff7;border-radius:19px;overflow:hidden;background:linear-gradient(#32145888,#52236166 62%,#754c3a 62% 66%,#d89946 66%);box-shadow:inset 0 0 25px #0007}.blocks{position:absolute;left:7%;right:7%;top:5%;height:55%}.block{position:absolute;width:17%;height:13%;border:2px solid #fff9;border-radius:6px;background:var(--c);box-shadow:inset 0 0 10px #fff5,0 5px 0 #0003;transform-origin:center bottom;transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .55s}.block:after{content:'';position:absolute;inset:15%;border:2px solid #fff6;border-radius:3px}.block.gold{background:linear-gradient(#fff28c,#e99915);box-shadow:0 0 18px #fff26a,inset 0 0 9px #fff}.block.fall-left{transform:translate(-45px,120px) rotate(-115deg);opacity:0}.block.fall-right{transform:translate(45px,130px) rotate(120deg);opacity:0}.block.fall-down{transform:translateY(155px) rotate(35deg);opacity:0}.clown{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:78px;filter:drop-shadow(0 0 9px #fff)}.clown.throw{animation:throw .35s}@keyframes throw{50%{transform:translateX(-50%) rotate(-14deg) scale(1.08)}}.ball{position:absolute;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fff,#ff325f 35%,#9d1135 72%);box-shadow:0 0 12px #fff;left:calc(50% - 14px);bottom:16%;opacity:0;pointer-events:none}.ball.fly{opacity:1;transition:transform .43s cubic-bezier(.18,.8,.3,1)}.hint{position:absolute;left:8%;right:8%;bottom:1%;text-align:left;font-size:11px;color:#442600;font-weight:800}.combo{position:absolute;z-index:8;left:50%;top:42%;transform:translate(-50%,-50%);font-size:35px;font-weight:1000;color:#fff36a;text-shadow:0 3px #c32a65,0 0 14px #fff;opacity:0}.combo.show{animation:pop 1s}@keyframes pop{20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}.rotate{position:fixed;z-index:100;inset:0;display:none;place-items:center;text-align:center;background:#190d38f5;font-size:24px;font-weight:900}@media(orientation:landscape){.rotate{display:grid}}@media(max-height:680px){.hero{font-size:58px}.title{font-size:31px}.clown{font-size:60px}.stat{padding:4px}.stat b{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><div class="app"><div class="shell"><div class="stars"></div><div class="tent"></div><div class="screen show" id="start"><div class="panel"><div class="hero">🤡</div><h1 class="title">ピエロの<br>積み木倒し</h1><p>積み木をタップしてボールを投げよう！<br>金色の積み木は高得点！</p><button class="btn" id="startBtn" aria-label="ゲームスタート">ゲームスタート</button></div></div><div class="game" id="game"><div class="hud"><div class="stat" id="timeBox">のこり時間<b id="time">60</b></div><div class="stat">スコア<b id="score">0</b></div></div><div class="arena" id="arena" aria-label="積み木をタップしてボールを投げるゲームエリア"><div class="blocks" id="blocks"></div><div class="ball" id="ball"></div><div class="clown" id="clown">🤡</div><div class="combo" id="combo"></div><div class="hint">積み木をタップ！ 倒れた数でコンボボーナス</div></div></div><div class="screen" id="result"><div class="panel"><div class="hero">🎪</div><h1 class="title">タイムアップ！</h1><p>最終スコア<br><b id="finalScore" style="font-size:44px;color:#ffe568">0</b></p><p>倒した積み木：<b id="finalBlocks">0</b>個</p><button class="btn" id="retryBtn" aria-label="もう一度遊ぶ">もう一度遊ぶ</button></div></div></div></div><div class="rotate">📱<br>スマートフォンを縦向きにしてください</div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state='START',score=0,time=60,down=0,blocks=[],timer=null,endAt=0,audio=null,throwing=false,round=0;const colors=['#ef3f52','#2c8ee8','#38b96b','#f1c62f','#a552cf'];function audioInit(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audio=null}}function tone(type,n=0){audioInit();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime,f={tap:330,throw:190,hit:520,gold:880,combo:720,end:90}[type]||400;o.type=type==='end'?'sawtooth':'sine';o.frequency.setValueAtTime(f+n,t);if(type==='throw')o.frequency.exponentialRampToValueAtTime(470,t+.24);if(type==='gold'||type==='combo')o.frequency.exponentialRampToValueAtTime(f*1.5,t+.24);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(audio.destination);o.start();o.stop(t+.38)}function show(id){$('start').classList.toggle('show',id==='start');$('game').classList.toggle('show',id==='game');$('result').classList.toggle('show',id==='result');state=id.toUpperCase()}function reset(){clearInterval(timer);score=0;time=60;down=0;round=0;throwing=false;$('score').textContent=0;$('time').textContent=60;$('timeBox').classList.remove('danger');show('game');newRound();endAt=performance.now()+60000;timer=setInterval(tick,100);tone('tap')}function tick(){time=Math.max(0,Math.ceil((endAt-performance.now())/1000));$('time').textContent=time;$('timeBox').classList.toggle('danger',time<=10);if(time<=0)finish()}function newRound(){round++;const box=$('blocks');box.innerHTML='';blocks=[];const rows=round%3===0?5:4;let id=0;for(let r=0;r<rows;r++){const count=5-r;for(let c=0;c<count;c++){const el=document.createElement('button'),gold=Math.random()<.1;el.className='block'+(gold?' gold':'');el.style.setProperty('--c',colors[(r+c+round)%colors.length]);el.style.left=(50-count*9+c*18)+'%';el.style.top=(52-r*12)+'%';el.setAttribute('aria-label',gold?'金色の積み木':'積み木');const data={id:id++,el,gold,alive:true,row:r,col:c};el.addEventListener('pointerup',e=>{e.preventDefault();throwBall(data,e)});box.appendChild(el);blocks.push(data)}}}function throwBall(target,e){if(state!=='GAME'||throwing||!target.alive)return;throwing=true;tone('throw');$('clown').classList.add('throw');const arena=$('arena').getBoundingClientRect(),tr=target.el.getBoundingClientRect(),x=tr.left+tr.width/2-(arena.left+arena.width/2),y=tr.top+tr.height/2-(arena.bottom-arena.height*.16);$('ball').classList.remove('fly');$('ball').style.transform='translate(0,0)';void $('ball').offsetWidth;$('ball').classList.add('fly');$('ball').style.transform=`translate(${x}px,${y}px)`;setTimeout(()=>impact(target),430)}function impact(target){if(state!=='GAME')return;let hit=[];for(const b of blocks){if(!b.alive)continue;const d=Math.abs(b.row-target.row)+Math.abs(b.col-target.col);const chance=d===0?1:d===1?.82:d===2?.42:.08;if(Math.random()<chance)hit.push(b)}if(!hit.length)hit=[target];hit.forEach((b,i)=>{b.alive=false;down++;const pts=b.gold?300:100;score+=pts;b.el.classList.add(['fall-left','fall-right','fall-down'][(b.id+i)%3]);tone(b.gold?'gold':'hit',i*28)});if(hit.length>=3){const bonus=hit.length*100;score+=bonus;showCombo(`${hit.length} COMBO +${bonus}`);tone('combo')}$('score').textContent=score;navigator.vibrate?.(18);setTimeout(()=>{$('ball').classList.remove('fly');$('ball').style.transform='';$('clown').classList.remove('throw');throwing=false;if(blocks.every(b=>!b.alive))setTimeout(newRound,350)},560)}function showCombo(text){const e=$('combo');e.textContent=text;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}function finish(){if(state!=='GAME')return;clearInterval(timer);state='ENDING';throwing=true;tone('end');$('finalScore').textContent=score;$('finalBlocks').textContent=down;setTimeout(()=>show('result'),500)}$('startBtn').onclick=()=>{audioInit();reset()};$('retryBtn').onclick=reset;document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='GAME')finish()});})();
</script></body></html>
